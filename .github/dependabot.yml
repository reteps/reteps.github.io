version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait until a release has aged past pnpm's minimumReleaseAge before
    # opening a PR, so every bump already satisfies the supply-chain policy.
    cooldown:
      default-days: 2
    # Bundle all npm updates into a single PR so there is only ever one
    # pnpm-lock.yaml change in flight — avoids cross-PR lockfile conflicts.
    groups:
      npm:
        patterns:
          - '*'
