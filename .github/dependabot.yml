version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait until a release has aged past pnpm's minimumReleaseAge before
    # opening a PR, so every bump already satisfies the supply-chain policy.
    cooldown:
      default-days: 2
